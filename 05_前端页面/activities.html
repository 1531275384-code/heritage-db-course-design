<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>研学活动 · 地方非遗文化数字化保护数据库管理系统</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main">
        <header class="topbar">
            <div>
                <h1>研学活动与报名</h1>
                <div class="crumb">首页 / 非遗进校园 · 研学活动发布 / 报名 / 智能推荐</div>
            </div>
            <div class="topbar-actions">
                <span class="badge" id="topbar-conn">● 检测中</span>
                <span class="badge teal" id="stat-open">开放报名 0 场</span>
            </div>
        </header>

        <main class="content">

            <!-- ============ 智能推荐 ============ -->
            <section class="section">
                <div class="card">
                    <div class="card-head">
                        <h3>研学活动智能推荐<small style="font-weight:400;color:#93897d">　算法模型：内容匹配 + 群体热度 + 项目级别</small></h3>
                        <div class="flex">
                            <label class="muted" style="font-size:12.5px">选择学生</label>
                            <select id="rec-student" style="min-width:220px"></select>
                            <button class="btn primary" id="btn-rec">重新计算推荐</button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="note teal mb0" id="rec-explain">
                            <span>ⓘ</span>
                            <span>Score = 内容匹配分（精准命中 5.0 / 兴趣为项目上级 4.0 / 项目为兴趣上级 4.0 / 同大门类 3.0）
                                  + 群体热度分（min(报名率 ÷ 10, 3.0)）+ 项目级别分（国家级 2.0 / 省级 1.5 / 市级 1.0 / 县级 0.5）</span>
                        </div>
                        <div class="mt14" id="rec-meta"></div>
                        <div class="grid g3 mt14" id="rec-list"></div>
                    </div>
                </div>
            </section>

            <!-- ============ 活动列表 ============ -->
            <section class="section">
                <h2 class="section-title">研学活动列表<small>报名人数 / 剩余名额 / 报名率由视图 v_activity_enrollment 实时计算</small></h2>

                <div class="card" style="margin-bottom:14px">
                    <div class="card-body">
                        <div class="toolbar">
                            <div class="field grow">
                                <label>关键词（活动名称 / 编号 / 非遗项目）</label>
                                <input type="search" id="a-kw" placeholder="如：越剧、青瓷、A-2026-005">
                            </div>
                            <div class="field">
                                <label>活动状态</label>
                                <select id="a-status"><option value="">全部</option></select>
                            </div>
                            <div class="field">
                                <label>所属门类</label>
                                <select id="a-cat"><option value="">全部</option></select>
                            </div>
                            <button class="btn" id="a-reset">重置</button>
                        </div>
                    </div>
                </div>

                <div class="grid g3" id="act-list"></div>
            </section>

        </main>
    </div>
</div>

<div id="toast-host"></div>

<script src="assets/js/snapshot.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script>
(function () {
    HUI.renderSidebar('activities.html');

    var ACTS = [], STU = [], CATS = [], ENUMS = {}, CUR_REC = null;

    function statusBadge(s) {
        var map = { '报名中': 'green', '已满员': 'red', '已结束': '', '已取消': '' };
        return '<span class="badge ' + (map[s] || '') + '">' + s + '</span>';
    }

    /* ------------------------------------------------ 活动列表 */
    function filteredActs() {
        var kw = document.getElementById('a-kw').value.trim().toLowerCase();
        var st = document.getElementById('a-status').value;
        var cat = document.getElementById('a-cat').value;
        return ACTS.filter(function (a) {
            if (kw) {
                var hay = [a.activity_name, a.activity_code, a.project_name].join(' ').toLowerCase();
                if (hay.indexOf(kw) < 0) return false;
            }
            if (st && a.activity_status !== st) return false;
            if (cat && String(a.category_id) !== cat && String(a.parent_category_id) !== cat) return false;
            return true;
        });
    }

    function renderActs() {
        var list = filteredActs();
        document.getElementById('stat-open').textContent =
            '开放报名 ' + ACTS.filter(function (a) { return a.activity_status === '报名中'; }).length + ' 场';

        document.getElementById('act-list').innerHTML = list.map(function (a) {
            var rate = HUI.num(a.enroll_rate);
            var canReg = a.activity_status === '报名中' && HUI.num(a.remaining_quota) > 0;
            return '<article class="acard" data-aid="' + a.activity_id + '">' +
                     '<div class="ac-head">' +
                       '<div><div class="ac-name">' + HUI.esc(a.activity_name) + '</div>' +
                         '<div class="ac-sub">' + a.activity_code + ' · ' + HUI.esc(a.course_name) + '</div></div>' +
                       statusBadge(a.activity_status) +
                     '</div>' +
                     '<div class="ac-meta">' +
                       '<span class="badge red">' + HUI.esc(a.project_name) + '</span>' +
                       '<span class="badge">' + HUI.esc(a.category_name) + '</span>' +
                       '<span class="badge teal">主讲 ' + HUI.esc(a.teacher_name) + '</span>' +
                     '</div>' +
                     '<div class="muted" style="font-size:12px">📍 ' + HUI.esc(a.activity_place) +
                       '<br>🕐 ' + a.start_time + ' — 截止 ' + a.deadline_time + '</div>' +
                     '<div>' +
                       '<div class="between" style="font-size:12px;margin-bottom:4px">' +
                         '<span class="muted">报名进度</span>' +
                         '<span><b>' + a.confirmed_total + '</b> / ' + a.plan_capacity + ' 人　剩余 <b style="color:#a4342a">' +
                           a.remaining_quota + '</b></span>' +
                       '</div>' +
                       '<div class="bar ' + (rate >= 100 ? 'red' : rate >= 60 ? 'gold' : 'green') + '">' +
                         '<i style="width:' + Math.min(rate, 100) + '%"></i></div>' +
                     '</div>' +
                     '<div class="ac-foot">' +
                       '<span class="quota">报名率 <b>' + rate.toFixed(1) + '%</b></span>' +
                       '<span class="flex">' +
                         '<button class="btn sm" data-detail="' + a.activity_id + '">查看名单</button>' +
                         '<button class="btn sm primary" data-reg="' + a.activity_id + '"' +
                           (canReg ? '' : ' disabled') + '>立即报名</button>' +
                       '</span>' +
                     '</div>' +
                   '</article>';
        }).join('') || '<div class="empty" style="grid-column:1/-1">没有符合条件的研学活动</div>';

        document.querySelectorAll('[data-detail]').forEach(function (b) {
            b.addEventListener('click', function (e) { e.stopPropagation(); openActDetail(b.dataset.detail); });
        });
        document.querySelectorAll('[data-reg]').forEach(function (b) {
            b.addEventListener('click', function (e) {
                e.stopPropagation();
                doRegister(Number(b.dataset.reg));
            });
        });
    }

    /* ------------------------------------------------ 报名 */
    function currentStudent() {
        return Number(document.getElementById('rec-student').value);
    }

    function doRegister(aid) {
        var sid = currentStudent();
        if (!sid) { HUI.toast('请先选择学生', 'warn'); return; }
        var name = (STU.filter(function (s) { return s.student_id === sid; })[0] || {}).student_name || '';

        HDATA.register(sid, aid).then(function (d) {
            if (d.success_flag === 1) {
                HUI.toast('<b>' + name + '</b>：' + HUI.esc(d.message), 'ok');
            } else {
                HUI.toast('<b>' + name + '</b>：' + HUI.esc(d.message) + '（错误码 ' + d.result_code + '）', 'warn');
            }
            reloadAll();
        }).catch(function (e) {
            HUI.toast('报名未执行：' + HUI.esc(e.message), 'err');
        });
    }

    /* ------------------------------------------------ 推荐 */
    var recToken = 0;   // 请求序号，防止并发请求返回顺序错乱导致界面回退
    function loadRecommend() {
        var sid = currentStudent();
        var token = ++recToken;
        document.getElementById('rec-list').innerHTML = '<div class="empty" style="grid-column:1/-1">正在调用推荐算法…</div>';
        HDATA.recommend(sid, 6).then(function (d) {
            if (token !== recToken) return;   // 已有更新的请求，丢弃本次结果
            if (!d) { document.getElementById('rec-list').innerHTML = '<div class="empty" style="grid-column:1/-1">暂无推荐结果</div>'; return; }
            CUR_REC = d;
            var s = d.student || {};
            document.getElementById('rec-meta').innerHTML =
                '<div class="flex" style="flex-wrap:wrap;gap:8px">' +
                  '<span class="badge teal">学生：' + HUI.esc(s.student_name) + '（' + HUI.esc(s.student_no) + '）</span>' +
                  '<span class="badge">学校：' + HUI.esc(s.school_name) + '</span>' +
                  '<span class="badge gold">兴趣门类：' + HUI.esc(s.interest_category || '未填写') + '</span>' +
                  '<span class="badge">候选活动 ' + d.candidate_count + ' 场 → 推荐前 ' +
                    (d.recommendations || []).length + ' 场</span>' +
                '</div>';

            var recs = d.recommendations || [];
            document.getElementById('rec-list').innerHTML = recs.map(function (a, i) {
                var rate = HUI.num(a.enroll_rate);
                return '<article class="acard">' +
                         '<div class="ac-head">' +
                           '<div><div class="ac-name">' + (i === 0 ? '🥇 ' : i === 1 ? '🥈 ' : i === 2 ? '🥉 ' : '') +
                             HUI.esc(a.activity_name) + '</div>' +
                             '<div class="ac-sub">' + HUI.esc(a.project_name) + ' · ' + HUI.esc(a.course_name) + '</div></div>' +
                           '<span class="score-pill" style="font-size:19px">' + a.recommend_score + '<small>分</small></span>' +
                         '</div>' +
                         '<div class="reason">' + HUI.esc(a.recommend_reason) + '</div>' +
                         '<div class="ac-meta">' +
                           '<span class="badge">' + HUI.esc(a.category_name) + '</span>' +
                           (a.parent_category_name ? '<span class="badge">' + HUI.esc(a.parent_category_name) + '</span>' : '') +
                           '<span class="badge teal">' + HUI.esc(a.teacher_name) + '</span>' +
                         '</div>' +
                         '<div class="muted" style="font-size:12px">📍 ' + HUI.esc(a.activity_place) +
                           '<br>🕐 ' + a.start_time + '</div>' +
                         '<div class="ac-foot">' +
                           '<span class="quota">剩余 <b>' + a.remaining_quota + '</b> 名额 · 报名率 <b>' + rate.toFixed(1) + '%</b></span>' +
                           '<button class="btn sm primary" data-reg2="' + a.activity_id + '">报名此场</button>' +
                         '</div>' +
                       '</article>';
            }).join('') || '<div class="empty" style="grid-column:1/-1">该学生暂无可推荐的活动</div>';

            document.querySelectorAll('[data-reg2]').forEach(function (b) {
                b.addEventListener('click', function () { doRegister(Number(b.dataset.reg2)); });
            });
        }).catch(function (e) {
            document.getElementById('rec-list').innerHTML = '<div class="empty" style="grid-column:1/-1">推荐失败：' + HUI.esc(e.message) + '</div>';
        });
    }

    /* ------------------------------------------------ 活动详情 */
    function openActDetail(aid) {
        var a = ACTS.filter(function (x) { return x.activity_id === Number(aid); })[0] || {};
        HUI.drawer(HUI.esc(a.activity_name || ''), '研学活动详情与报名名单', '<div class="empty">读取活动档案…</div>');

        HDATA.activityDetail(aid).then(function (d) {
            if (!d) {
                /* 离线模式：使用快照中的活动基础信息 */
                var same = ACTS.filter(function (x) { return String(x.activity_id) === String(aid); })[0] || {};
                HUI.drawer(HUI.esc(same.activity_name || ''), '离线演示模式（仅基础信息）',
                    '<div class="note"><span>ⓘ</span><span>离线快照未包含报名名单，' +
                    '启动后端服务（python app.py）后即可查看完整名单与审计日志。</span></div>' +
                    '<div class="mt14 card"><div class="card-body"><dl class="dl">' +
                    row('活动编号', same.activity_code) + row('所属课程', HUI.esc(same.course_name)) +
                    row('非遗项目', HUI.esc(same.project_name)) + row('主讲传承人', HUI.esc(same.teacher_name)) +
                    row('活动地点', HUI.esc(same.activity_place)) + row('开始时间', same.start_time) +
                    row('报名截止', same.deadline_time) + row('计划人数', same.plan_capacity) +
                    row('已报名', same.confirmed_total) + row('剩余名额', same.remaining_quota) +
                    row('活动状态', statusBadge(same.activity_status)) +
                    '</dl></div></div>');
                return;
            }
            var act = d.activity || {}, st = d.stats || {};
            var body =
              '<div class="flex" style="flex-wrap:wrap;gap:8px">' +
                statusBadge(act.activity_status) +
                '<span class="badge red">' + HUI.esc(act.project_name) + '</span>' +
                '<span class="badge">' + HUI.esc(act.category_name) + '</span>' +
                '<span class="badge teal">' + HUI.esc(act.course_type) + ' · ' + act.class_hours + ' 课时</span>' +
              '</div>' +
              '<div class="grid g4 mt14">' +
                mini('计划人数', act.plan_capacity) +
                mini('有效报名', st.confirmed || 0) +
                mini('候补', st.waiting || 0) +
                mini('剩余名额', act.remaining_quota) +
                mini('实际签到', st.checkin || 0) +
                mini('平均成绩', st.avg_score == null ? '—' : st.avg_score) +
                mini('最高成绩', st.max_score == null ? '—' : st.max_score) +
                mini('报名率', HUI.num(act.enroll_rate).toFixed(1) + '%') +
              '</div>' +
              '<div class="card mt14"><div class="card-body"><dl class="dl">' +
                row('活动编号', act.activity_code) + row('所属课程', HUI.esc(act.course_name)) +
                row('主讲传承人', HUI.esc(act.teacher_name)) + row('活动地点', HUI.esc(act.activity_place)) +
                row('开始时间', act.start_time) + row('报名截止', act.deadline_time) +
                row('组织单位', HUI.esc(act.organizer)) +
              '</dl></div></div>' +
              '<h3 class="section-title mt20" style="font-size:13.5px">报名名单<small>共 ' + (d.roster || []).length + ' 条记录</small></h3>' +
              '<div id="dt-roster"></div>' +
              '<h3 class="section-title mt20" style="font-size:13.5px">操作审计日志<small>由触发器 trg_reg_after_insert / trg_reg_after_update 自动写入</small></h3>' +
              '<div id="dt-logs"></div>';

            HUI.drawer(HUI.esc(act.activity_name), act.activity_code + ' · ' + HUI.esc(act.organizer), body);

            HUI.table(document.getElementById('dt-roster'), [
                { key: 'student_no', label: '学号', mono: true, width: '112px' },
                { key: 'student_name', label: '姓名', width: '80px' },
                { key: 'school_name', label: '学校', width: '150px' },
                { key: 'grade', label: '年级', width: '76px' },
                { key: 'register_time', label: '报名时间', width: '132px' },
                { key: 'register_status', label: '报名状态', width: '86px', render: function (r) {
                    var map = { '已录取': 'green', '已报名': 'teal', '候补': 'gold', '已取消': '' };
                    return '<span class="badge ' + (map[r.register_status] || '') + '">' + r.register_status + '</span>'; } },
                { key: 'attendance_status', label: '出勤', width: '78px', render: function (r) {
                    return r.attendance_status === '已签到'
                        ? '<span class="badge green">已签到</span>'
                        : '<span class="badge">' + r.attendance_status + '</span>'; } },
                { key: 'score', label: '成绩', align: 'right', width: '66px', render: function (r) {
                    return r.score == null ? '<span class="muted">—</span>' : '<b>' + r.score + '</b>'; } },
                { key: 'comment', label: '研学评价', width: '180px', render: function (r) {
                    return r.comment ? HUI.esc(r.comment) : '<span class="muted">—</span>'; } }
            ], d.roster || [], { emptyText: '本场活动暂无报名记录' });

            HUI.table(document.getElementById('dt-logs'), [
                { key: 'log_time', label: '时间', width: '128px' },
                { key: 'action_type', label: '类型', width: '72px', render: function (r) {
                    return '<span class="badge ' + (r.action_type === 'INSERT' ? 'green' : 'gold') + '">' + r.action_type + '</span>'; } },
                { key: 'record_id', label: '记录ID', align: 'right', width: '72px' },
                { key: 'action_desc', label: '操作描述' }
            ], d.logs || [], { emptyText: '暂无相关审计日志' });
        }).catch(function (e) {
            HUI.closeDrawer();
            HUI.toast('读取失败：' + HUI.esc(e.message), 'err');
        });
    }

    function mini(label, value) {
        return '<div class="card" style="padding:11px 13px"><div class="muted" style="font-size:12px">' + label +
               '</div><div style="font-size:20px;font-weight:700">' + value + '</div></div>';
    }
    function row(k, v) { return '<dt>' + k + '</dt><dd>' + v + '</dd>'; }

    /* ------------------------------------------------ 数据加载 */
    function reloadAll() {
        return Promise.all([
            HDATA.get('/api/activities', { size: 200 }),
            HDATA.get('/api/students')
        ]).then(function (r) {
            ACTS = r[0] || []; STU = r[1] || [];
            renderActs();
            loadRecommend();
        });
    }

    function init() {
        ['a-kw', 'a-status', 'a-cat'].forEach(function (id) {
            document.getElementById(id).addEventListener(id === 'a-kw' ? 'input' : 'change', renderActs);
        });
        document.getElementById('a-reset').addEventListener('click', function () {
            ['a-kw', 'a-status', 'a-cat'].forEach(function (id) { document.getElementById(id).value = ''; });
            renderActs();
        });
        document.getElementById('btn-rec').addEventListener('click', loadRecommend);
        document.getElementById('rec-student').addEventListener('change', loadRecommend);

        Promise.all([
            HDATA.get('/api/categories'), HDATA.get('/api/meta/enums')
        ]).then(function (r) {
            CATS = r[0] || []; ENUMS = r[1] || {};
            HUI.setConnState(HDATA.online, HDATA.message);

            document.getElementById('a-status').innerHTML = '<option value="">全部</option>' +
                (ENUMS.activity_status || []).map(function (v) { return '<option>' + v + '</option>'; }).join('');

            var html = '<option value="">全部</option>';
            CATS.forEach(function (c) {
                html += '<option value="' + c.category_id + '">' + HUI.esc(c.category_name) + '（大门类）</option>';
                (c.children || []).forEach(function (s) {
                    html += '<option value="' + s.category_id + '">&nbsp;&nbsp;└ ' + HUI.esc(s.category_name) + '</option>';
                });
            });
            document.getElementById('a-cat').innerHTML = html;

            return reloadAll();
        }).then(function () {
            HDATA.get('/api/students').then(function (list) {
                STU = list || [];
                document.getElementById('rec-student').innerHTML = STU.map(function (s) {
                    return '<option value="' + s.student_id + '">' + HUI.esc(s.student_name) + '（' +
                           HUI.esc(s.student_no) + ' · ' + HUI.esc(s.interest_category || '无兴趣') + '）</option>';
                }).join('');
                loadRecommend();

                // 支持通过 URL 参数直接打开某场活动的详情抽屉，便于分享与演示
                // 例：activities.html?aid=12&sid=15
                var q = new URLSearchParams(location.search);
                var sid = q.get('sid');
                if (sid) {
                    document.getElementById('rec-student').value = sid;
                    loadRecommend();
                }
                var aid = q.get('aid');
                if (aid) { openActDetail(aid); }
            });
        }).catch(function (e) {
            HUI.setConnState(false, e.message);
            HUI.toast('数据加载失败：' + HUI.esc(e.message), 'err');
        });
    }

    init();
})();
</script>
</body>
</html>
